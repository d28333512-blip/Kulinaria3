<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodGram — Кулинарная Соцсеть</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ВСПЛЫВАЮЩЕЕ ОКНО: СОЗДАНИЕ ИЛИ ВХОД В ПРОФИЛЬ -->
    <div class="modal-overlay" id="authOverlay">
        <div class="modal-box">
            <h2>Создание профиля FoodGram</h2>
            <p class="auth-hint">Придумайте никнейм и выберите аватарку, чтобы публиковать рецепты и общаться в чате!</p>
            <form id="authForm">
                <input type="text" id="authUsername" placeholder="Ваш никнейм (например, Шеф_Даня)" required>
                <div class="avatar-picker">
                    <span class="avatar-option active" onclick="selectAvatar(this, '👨‍🍳')">👨‍🍳</span>
                    <span class="avatar-option" onclick="selectAvatar(this, '👩‍🍳')">👩‍🍳</span>
                    <span class="avatar-option" onclick="selectAvatar(this, '🍊')">🍊</span>
                    <span class="avatar-option" onclick="selectAvatar(this, '🍕')">🍕</span>
                    <span class="avatar-option" onclick="selectAvatar(this, '🥑')">🥑</span>
                </div>
                <button type="submit" class="submit-btn">Создать профиль</button>
            </form>
        </div>
    </div>

    <!-- ВСПЛЫВАЮЩЕЕ ОКНО: ВЫЛОЖИТЬ РЕЦЕПТ -->
    <div class="modal-overlay" id="recipeModal" style="display: none;">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Поделиться шедевром</h3>
                <button class="close-btn" onclick="toggleModal('recipeModal', false)">✕</button>
            </div>
            <form id="recipeForm" enctype="multipart/form-data">
                <input type="text" id="recipeTitle" placeholder="Название блюда" required>
                <div class="file-upload-box">
                    <label for="recipeFile">📁 Выберите фото блюда с ПК</label>
                    <input type="file" id="recipeFile" accept="image/*" required>
                </div>
                <textarea id="recipeDesc" placeholder="Опишите рецепт приготовления..." rows="4" required></textarea>
                <button type="submit" class="submit-btn">Опубликовать</button>
            </form>
        </div>
    </div>

    <!-- НАВИГАЦИОННАЯ ПАНЕЛЬ С КНОПКАМИ ВКЛАДОК -->
    <header class="navbar">
        <div class="logo">🍊 Food<span>Gram</span></div>
        <nav class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('feedTab')">Лента</button>
            <button class="tab-btn" onclick="switchTab('chatTab')">Чат</button>
            <button class="tab-btn" onclick="switchTab('profileTab')">Профиль</button>
        </nav>
        <button class="add-recipe-btn" onclick="toggleModal('recipeModal', true)">+ Выложить блюдо</button>
    </header>

    <!-- ГЛАВНЫЕ ЭКРАНЫ САЙТА -->
    <div class="main-layout">

        <!-- 1. ВКЛАДКА: ЛЕНТА РЕЦЕПТОВ -->
        <section id="feedTab" class="tab-content active-content">
            <div class="feed-container" id="feedContainer"></div>
        </section>

        <!-- 2. ВКЛАДКА: ОБЩИЙ ЧАТ КУЛИНАРОВ -->
        <section id="chatTab" class="tab-content">
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatMessageInput" placeholder="Напишите сообщение в кулинарный чат...">
                    <button id="sendMsgBtn">Отправить</button>
                </div>
            </div>
        </section>

        <!-- 3. ВКЛАДКА: ПРОФИЛЬ ПОЛЬЗОВАТЕЛЯ -->
        <section id="profileTab" class="tab-content">
            <div class="profile-container">
                <div class="profile-card">
                    <div class="profile-avatar" id="profileAvatarDisplay">👨‍🍳</div>
                    <h2 id="profileNameDisplay">Шеф</h2>
                    <p class="profile-stats">Ваши публикации:</p>
                </div>
                <!-- Лента только личных постов для удаления -->
                <div class="my-recipes-feed" id="myRecipesContainer"></div>
            </div>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
