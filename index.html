<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodGram</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ОКНО ВХОДА И РЕГИСТРАЦИИ -->
    <div class="reg-overlay" id="regOverlay">
        <div class="reg-box">
            <h2>Добро пожаловать в FoodGram</h2>
            <p>Введите ваш постоянный никнейм. Если аккаунта нет, мы его создадим!</p>
            <form id="regForm">
                <input type="text" id="regUsername" placeholder="Ваш никнейм (например, Chef_Danya)" required>
                <select id="regAvatar">
                    <option value="👨‍🍳">👨‍🍳 Повар мужчина</option>
                    <option value="👩‍🍳">👩‍🍳 Повар женщина</option>
                    <option value="🍕">🍕 Пицца-мен</option>
                    <option value="🥑">🥑 Авокадо</option>
                </select>
                <input type="text" id="regBio" placeholder="Пара слов о себе (ваше био)">
                <button type="submit">Войти в аккаунт</button>
            </form>
        </div>
    </div>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ НАВИГАЦИИ -->
    <header class="navbar">
        <div class="logo">🍊 Food<span>Gram</span></div>
        <nav class="nav-menu">
            <button class="nav-link active" id="feedLink" onclick="showScreen('feed')">Лента</button>
            <button class="nav-link" id="chatLink" onclick="showScreen('chat')">Чат поваров</button>
            <button class="nav-link" id="profileLink" onclick="showScreen('profile')">Профиль</button>
        </nav>
        <button class="add-recipe-btn" onclick="toggleModal(true)">+ Поделиться рецептом</button>
    </header>

    <!-- СЕКЦИЯ ЛЕНТЫ И ПРОФИЛЯ -->
    <main class="feed-container" id="feedContainer"></main>

    <!-- ИНФОРМАЦИОННЫЙ БЛОК ПРОФИЛЯ (СКРЫТ ПО УМОЛЧАНИЮ) -->
    <div class="profile-card-container" id="profileContainer" style="display: none;">
        <div class="profile-header-box">
            <div class="profile-big-avatar" id="profileAvatar">👤</div>
            <h2 id="profileName">Загрузка...</h2>
            <p id="profileBio">Описание профиля...</p>
        </div>
        <h3 style="text-align: center; margin-top: 30px; color: #ff6b35;">Мои публикации:</h3>
    </div>

    <!-- ЭКРАН МЕГА-ЧАТА СО СКРОЛЛОМ -->
    <div class="chat-container" id="chatContainer" style="display: none;">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="Напишите сообщение в кулинарный чат...">
            <button id="chatSendBtn">Отправить</button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ БЛЮДА -->
    <div class="modal-overlay" id="modalOverlay" style="display: none;">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Новая публикация</h3>
                <button class="close-btn" onclick="toggleModal(false)">✕</button>
            </div>
            <form id="recipeForm" enctype="multipart/form-data">
                <input type="text" id="recipeTitle" placeholder="Название блюда" required>
                <div class="file-upload-box">
                    <label for="recipeFile">📁 Выберите фото с компьютера</label>
                    <input type="file" id="recipeFile" accept="image/*" required>
                </div>
                <textarea id="recipeDesc" placeholder="Процесс приготовления..." rows="4" required></textarea>
                <button type="submit" class="submit-btn">Опубликовать шедевр</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
